# 规范智能问答助手系统 — test 分支隔离部署（独立容器名/端口/数据库卷）
# 使用：docker compose up -d --build
services:
  app:
    container_name: form_research-app-test
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8000"        # test 分支用 8080，避免与 MinerU 分支的 80 冲突
    volumes:
      - ./uploads:/app/uploads        # 原始文档持久化（共享宿主机目录）
    environment:
      - DATABASE_URL=postgresql://app:app@db:5432/qa
      - LLM_ENCRYPT_KEY=${LLM_ENCRYPT_KEY:-}
      - MINERU_API_URL=${MINERU_API_URL:-}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-512}
      - EMBEDDING_USE_LOCAL=${EMBEDDING_USE_LOCAL:-true}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
      - LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - ENABLE_QUERY_REWRITE=${ENABLE_QUERY_REWRITE:-true}
      - ENABLE_RERANK=${ENABLE_RERANK:-false}
      - RETRIEVE_MODE=${RETRIEVE_MODE:-vector_only}
      - HYBRID_BM25_WEIGHT=${HYBRID_BM25_WEIGHT:-0.3}
      - HYBRID_VECTOR_WEIGHT=${HYBRID_VECTOR_WEIGHT:-0.7}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    container_name: form_research-db-test
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=qa
    volumes:
      - pgdata_test:/var/lib/postgresql/data   # test 分支独立卷，与 MinerU 分支数据库隔离
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d qa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata_test:
