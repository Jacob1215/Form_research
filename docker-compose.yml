# 规范智能问答助手系统 — 两容器编排（应用服务 + 数据库）
# 使用：docker compose up -d --build
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "80:8000"          # 宿主机 80 → 容器 8000；如 80 被占用可改为 "8080:8000"
    volumes:
      - ./uploads:/app/uploads        # 原始文档持久化
    environment:
      - DATABASE_URL=postgresql://app:app@db:5432/qa
      - LLM_ENCRYPT_KEY=${LLM_ENCRYPT_KEY:-}
      - MINERU_API_URL=${MINERU_API_URL:-http://mineru:8000}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-512}
      - EMBEDDING_USE_LOCAL=${EMBEDDING_USE_LOCAL:-true}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
      - LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - ENABLE_QUERY_REWRITE=${ENABLE_QUERY_REWRITE:-true}
      - ENABLE_RERANK=${ENABLE_RERANK:-false}
      - RETRIEVE_MODE=${RETRIEVE_MODE:-vector_only}
      - HYBRID_BM25_WEIGHT=${HYBRID_BM25_WEIGHT:-0.3}
      - HYBRID_VECTOR_WEIGHT=${HYBRID_VECTOR_WEIGHT:-0.7}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
      mineru:
        condition: service_healthy
    restart: unless-stopped

  # MinerU PDF 解析服务（本地封装 HTTP API，基于官方 CPU 镜像）
  # 提供 POST /file_parse 接口，返回 { md_content, images[], total_pages }
  # CPU 版约 4GB 内存；模型在首次请求时懒加载，权重持久化到 mineru_models 卷
  mineru:
    build:
      context: ./mineru_api
      dockerfile: Dockerfile
    container_name: form-research-mineru
    ports:
      - "8088:8000"          # 宿主机 8088 → 容器 8000（调试用，可注释）
    volumes:
      - mineru_models:/root/.cache    # 模型权重持久化，避免重启重新下载
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s    # 服务本身秒级启动，模型懒加载不阻塞健康检查
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=qa
    volumes:
      - pgdata:/var/lib/postgresql/data   # 必须用命名卷：bind mount 到 Windows(NTFS) 目录会让 initdb chmod 失败
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d qa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  mineru_models:
