/* ============================================
   智能问答助手系统 — Brand CSS
   Professional Indigo Tech SaaS
   ============================================ */

/* ---- Root Tokens ---- */
:root {
  /* Primary — Indigo */
  --qa-primary-50:  #eef2ff;
  --qa-primary-100: #e0e7ff;
  --qa-primary-200: #c7d2fe;
  --qa-primary-300: #a5b4fc;
  --qa-primary-400: #818cf8;
  --qa-primary-500: #6366f1;
  --qa-primary-600: #4f46e5;
  --qa-primary-700: #4338ca;
  --qa-primary-800: #3730a3;
  --qa-primary-900: #312e81;

  /* Neutral scale */
  --qa-neutral-0:   #ffffff;
  --qa-neutral-50:  #f8fafc;
  --qa-neutral-100: #f1f5f9;
  --qa-neutral-200: #e2e8f0;
  --qa-neutral-300: #cbd5e1;
  --qa-neutral-400: #94a3b8;
  --qa-neutral-500: #64748b;
  --qa-neutral-600: #475569;
  --qa-neutral-700: #334155;
  --qa-neutral-800: #1e293b;
  --qa-neutral-900: #0f172a;

  /* State colors */
  --state-success: #10b981;
  --state-success-soft: #d1fae5;
  --state-warning: #f59e0b;
  --state-warning-soft: #fef3c7;
  --state-error: #ef4444;
  --state-error-soft: #fee2e2;
  --state-info: #3b82f6;
  --state-info-soft: #dbeafe;
  --state-success-strong: #047857;

  /* Semantic aliases — light mode */
  --qa-background: #ffffff;
  --qa-foreground: #0f172a;
  --qa-card: #ffffff;
  --qa-card-foreground: #0f172a;
  --qa-popover: #ffffff;
  --qa-popover-foreground: #0f172a;
  --qa-primary: #4f46e5;
  --qa-primary-foreground: #ffffff;
  --qa-muted: #f1f5f9;
  --qa-muted-foreground: #64748b;
  --qa-border: #e2e8f0;
  --qa-input: #e2e8f0;
  --qa-ring: #6366f1;

  /* Radius */
  --qa-radius-small: 4px;
  --qa-radius-medium: 8px;
  --qa-radius-large: 12px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Typography */
  --qa-font-sans: "Inter", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --qa-font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
}

/* ---- Dark mode aliases ---- */
.dark {
  --qa-background: #0f172a;
  --qa-foreground: #f1f5f9;
  --qa-card: #1e293b;
  --qa-card-foreground: #f1f5f9;
  --qa-popover: #1e293b;
  --qa-popover-foreground: #f1f5f9;
  --qa-primary: #6366f1;
  --qa-primary-foreground: #ffffff;
  --qa-muted: #334155;
  --qa-muted-foreground: #94a3b8;
  --qa-border: #334155;
  --qa-input: #334155;
  --qa-ring: #818cf8;
}

/* ---- Typography classes ---- */
.font-sans { font-family: var(--qa-font-sans); }
.font-mono { font-family: var(--qa-font-mono); }

.text-display { font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
.text-heading { font-size: 20px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
.text-subheading { font-size: 16px; font-weight: 600; line-height: 1.5; }
.text-body { font-size: 14px; font-weight: 400; line-height: 1.6; }
.text-small { font-size: 13px; font-weight: 400; line-height: 1.5; }
.text-caption { font-size: 12px; font-weight: 400; line-height: 1.4; color: var(--qa-muted-foreground); }
.text-mono-sm { font-family: var(--qa-font-mono); font-size: 13px; line-height: 1.5; }

/* ---- Base ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--qa-font-sans);
  font-size: 14px;
  line-height: 1.6;
  color: var(--qa-foreground);
  background: var(--qa-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

<body>
  <style id="critical-layout">
    /* ===== Layout: body flex column, header full width, sidebar + content row ===== */
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--qa-neutral-50);
    }
    .app-header { flex-shrink: 0; }
    .layout-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .app-sidebar { flex-shrink: 0; width: 240px; overflow-y: auto; }
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      background: var(--qa-neutral-50);
    }
  </style>

  <style>
    /* ===== Shared shell: header + sidebar styles ===== */
    .app-header {
      height: 56px;
      background: var(--qa-card);
      border-bottom: 1px solid var(--qa-border);
    }
    .header-inner {
      height: 100%;
      max-width: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { display: block; flex-shrink: 0; }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--qa-foreground);
      letter-spacing: -0.01em;
    }
    .header-nav { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--qa-radius-medium);
      font-size: 13px;
      font-weight: 500;
      color: var(--qa-muted-foreground);
      text-decoration: none;
      transition: background-color .15s ease, color .15s ease;
    }
    .nav-link:hover { background: var(--qa-muted); color: var(--qa-foreground); }
    .nav-link.is-active { background: var(--qa-primary-50); color: var(--qa-primary); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-chip { display: flex; align-items: center; gap: 8px; }
    .user-avatar {
      width: 30px; height: 30px;
      border-radius: var(--radius-full);
      background: var(--qa-primary);
      color: var(--qa-primary-foreground);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .user-name { font-size: 13px; font-weight: 500; color: var(--qa-foreground); }
    .icon-btn {
      width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--qa-border);
      background: var(--qa-card);
      color: var(--qa-muted-foreground);
      border-radius: var(--qa-radius-medium);
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    }
    .icon-btn:hover { background: var(--qa-muted); color: var(--qa-foreground); border-color: var(--qa-neutral-300); }

    /* ===== Sidebar ===== */
    .app-sidebar {
      background: var(--qa-card);
      border-right: 1px solid var(--qa-border);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
    }
    .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--qa-radius-medium);
      font-size: 14px;
      font-weight: 500;
      color: var(--qa-muted-foreground);
      text-decoration: none;
      transition: background-color .15s ease, color .15s ease;
    }
    .sidebar-item:hover { background: var(--qa-muted); color: var(--qa-foreground); }
    .sidebar-item.is-active {
      background: var(--qa-primary);
      color: var(--qa-primary-foreground);
    }
    .sidebar-item.is-active:hover { background: var(--qa-primary-700); color: var(--qa-primary-foreground); }
    .sidebar-footer { padding-top: 12px; border-top: 1px solid var(--qa-border); }
    .sidebar-version { font-size: 12px; color: var(--qa-muted-foreground); padding: 4px 12px; }

    /* ===== Page title ===== */
    .page-head { margin-bottom: 20px; }
    .page-title { font-size: 22px; font-weight: 700; color: var(--qa-foreground); letter-spacing: -0.01em; }
    .page-subtitle { font-size: 13px; color: var(--qa-muted-foreground); margin-top: 4px; }

    /* ===== Card ===== */
    .card {
      background: var(--qa-card);
      border: 1px solid var(--qa-border);
      border-radius: var(--qa-radius-large);
      padding: 24px;
    }
    .card + .card { margin-top: 20px; }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--qa-foreground);
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--qa-border);
    }

    /* ===== Form ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.span-2 { grid-column: span 2; }
    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--qa-foreground);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .req-mark { color: var(--state-error); font-size: 13px; line-height: 1; }
    .form-control {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--qa-input);
      border-radius: var(--qa-radius-medium);
      background: var(--qa-card);
      color: var(--qa-foreground);
      font-size: 14px;
      font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
      width: 100%;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--qa-ring);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    select.form-control {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      padding-right: 34px;
    }
    .input-group {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--qa-input);
      border-radius: var(--qa-radius-medium);
      overflow: hidden;
      background: var(--qa-card);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input-group:focus-within {
      border-color: var(--qa-ring);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .input-group .form-control {
      border: none;
      box-shadow: none;
      border-radius: 0;
      flex: 1;
    }
    .input-group .form-control:focus { box-shadow: none; }
    .input-suffix {
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      color: var(--qa-muted-foreground);
      background: var(--qa-neutral-50);
      border-left: 1px solid var(--qa-border);
    }
    .input-toggle-btn {
      width: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-left: 1px solid var(--qa-border);
      background: var(--qa-neutral-50);
      color: var(--qa-muted-foreground);
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }
    .input-toggle-btn:hover { background: var(--qa-neutral-100); color: var(--qa-foreground); }
    .input-toggle-btn svg { width: 18px; height: 18px; }

    /* ===== Range slider ===== */
    .range-row { display: flex; flex-direction: column; gap: 8px; }
    .range-value {
      font-family: var(--qa-font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--qa-primary);
      background: var(--qa-primary-50);
      padding: 2px 8px;
      border-radius: var(--qa-radius-small);
    }
    input[type="range"].form-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--qa-neutral-200);
      border-radius: var(--radius-full);
      outline: none;
      padding: 0;
      border: none;
      cursor: pointer;
      margin-top: 6px;
    }
    input[type="range"].form-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px; height: 18px;
      border-radius: var(--radius-full);
      background: var(--qa-primary);
      border: 2px solid var(--qa-card);
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      cursor: pointer;
      transition: transform .15s ease;
    }
    input[type="range"].form-range::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type="range"].form-range::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: var(--radius-full);
      background: var(--qa-primary);
      border: 2px solid var(--qa-card);
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      cursor: pointer;
    }
    .range-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--qa-muted-foreground); margin-top: 2px; }

    /* ===== Toggle switch ===== */
    .toggle-field { flex-direction: row; align-items: center; justify-content: space-between; }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--qa-neutral-300);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background-color .2s ease;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: var(--qa-card);
      border-radius: var(--radius-full);
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: transform .2s ease;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--qa-primary); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
    .toggle-switch input:focus-visible + .toggle-slider {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    /* ===== Action buttons ===== */
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--qa-border);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 18px;
      border-radius: var(--qa-radius-medium);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
      white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-secondary {
      background: var(--qa-card);
      color: var(--qa-foreground);
      border-color: var(--qa-border);
    }
    .btn-secondary:hover { background: var(--qa-muted); border-color: var(--qa-neutral-300); }
    .btn-primary {
      background: var(--qa-primary);
      color: var(--qa-primary-foreground);
    }
    .btn-primary:hover { background: var(--qa-primary-700); }
    .btn-primary:focus-visible { box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3); }

    /* ===== Table ===== */
    .table-wrap { width: 100%; overflow-x: auto; }
    table.config-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .config-table thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--qa-muted-foreground);
      background: var(--qa-neutral-50);
      border-bottom: 1px solid var(--qa-border);
      white-space: nowrap;
    }
    .config-table tbody td {
      padding: 14px;
      border-bottom: 1px solid var(--qa-border);
      color: var(--qa-foreground);
      vertical-align: middle;
    }
    .config-table tbody tr:last-child td { border-bottom: none; }
    .config-table tbody tr { transition: background-color .15s ease; }
    .config-table tbody tr:hover { background: var(--qa-neutral-50); }
    .col-name { font-weight: 600; color: var(--qa-foreground); }
    .col-mono { font-family: var(--qa-font-mono); font-size: 12px; color: var(--qa-neutral-700); }
    .col-time { color: var(--qa-muted-foreground); font-size: 12px; white-space: nowrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }
    .badge::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: var(--radius-full);
      background: currentColor;
    }
    .badge-success { background: var(--state-success-soft); color: var(--state-success-strong); }
    .badge-muted { background: var(--qa-neutral-100); color: var(--qa-neutral-600); }

    .row-actions { display: flex; gap: 4px; }
    .row-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: var(--qa-radius-small);
      font-size: 12px;
      font-weight: 500;
      color: var(--qa-muted-foreground);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }
    .row-action svg { width: 14px; height: 14px; }
    .row-action:hover { background: var(--qa-muted); color: var(--qa-foreground); }
    .row-action.danger:hover { background: var(--state-error-soft); color: var(--state-error); }

    .table-footer {

      justify-content: space-between;
      align-items: center;

      margin-top: 4px;
      border-top: 1px solid var(--qa-border);

      color: var(--qa-muted-foreground);

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

          <!-- Row 3 (full width) -->

            <label class="form-label" for="cfg-key">API密钥<span class="req-mark" aria-hidden="true">*</span></label>
            <div class="input-group">
              <input class="form-control" id="cfg-key" type="password" value="sk-********************" required>
              <button class="input-toggle-btn" type="button" data-dom-id="toggle-apikey" aria-label="显示/隐藏 API 密钥" aria-pressed="false">
                <!-- eye icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

  <script>
    // API key show/hide toggle
    (function () {
      var btn = document.querySelector('[data-dom-id="toggle-apikey"]');
      var input = document.getElementById('cfg-key');
      if (!btn || !input) return;
      var eyeOn = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
      var eyeOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
      btn.addEventListener('click', function () {
        var isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.innerHTML = isHidden ? eyeOff : eyeOn;
        btn.setAttribute('aria-pressed', String(isHidden));
      });
    })();
    // Temperature slider live value
    (function () {
      var slider = document.querySelector('[data-dom-id="temp-slider"]');
      var out = document.querySelector('[data-dom-id="temp-value"]');
      if (!slider || !out) return;
      slider.addEventListener('input', function () {
        out.textContent = parseFloat(slider.value).toFixed(1);
      });
    })();
  </script>
