# 规范智能问答助手系统 — test 分支隔离部署（独立容器名/端口/数据库卷）
# 使用：docker compose up -d --build
services:
  app:
    container_name: form_research-app-test
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8000"        # test 分支用 8080，避免与 MinerU 分支的 80 冲突
    volumes:
      - ./uploads:/app/uploads        # 原始文档持久化（共享宿主机目录）
    environment:
      # 全部纯透传（${VAR:-}）；默认值单一来源 = backend/app/config.py
      # （config.py 已设 env_ignore_empty=True，.env 未配的键落回 config 默认值）
      - DATABASE_URL=${DATABASE_URL:-}
      - LLM_ENCRYPT_KEY=${LLM_ENCRYPT_KEY:-}
      - MINERU_API_URL=${MINERU_API_URL:-}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-}
      - EMBEDDING_USE_LOCAL=${EMBEDDING_USE_LOCAL:-}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-}
      - LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL:-}
      - ENABLE_QUERY_REWRITE=${ENABLE_QUERY_REWRITE:-}
      - ENABLE_RERANK=${ENABLE_RERANK:-}
      - RETRIEVE_MODE=${RETRIEVE_MODE:-}
      - HYBRID_BM25_WEIGHT=${HYBRID_BM25_WEIGHT:-}
      - HYBRID_VECTOR_WEIGHT=${HYBRID_VECTOR_WEIGHT:-}
      - RAG_TOP_K=${RAG_TOP_K:-}
      - VECTOR_SCORE_THRESHOLD=${VECTOR_SCORE_THRESHOLD:-}
      - ENABLE_SUBSTRING_BOOST=${ENABLE_SUBSTRING_BOOST:-}
      - SUBSTRING_PHRASE_WEIGHT=${SUBSTRING_PHRASE_WEIGHT:-}
      - ENABLE_LITERAL_FORCE_INJECT=${ENABLE_LITERAL_FORCE_INJECT:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    container_name: form_research-db-test
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=qa
    volumes:
      - pgdata_test:/var/lib/postgresql/data   # test 分支独立卷，与 MinerU 分支数据库隔离
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d qa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata_test:
